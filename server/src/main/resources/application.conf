# Server settings. Each value can be overridden by the environment variable on the line below it.
isla {
    # Interface to listen on. 127.0.0.1 = this machine only; 0.0.0.0 = all interfaces (reachable from the network).
    host = "127.0.0.1"
    host = ${?HOST}

    port = 8080
    port = ${?PORT}

    # SQLite database file, relative to the working directory.
    db = "game.db"
    db = ${?ISLA_DB}
}
