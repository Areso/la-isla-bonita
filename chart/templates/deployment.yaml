apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isla.fullname" . }}
  labels:
    {{- include "isla.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The old pod must release the SQLite volume before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "isla.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isla.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: ISLA_DB
              value: /data/game.db
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
          ports:
            - name: http
              containerPort: 8080
          # /world waits for the simulation lock, so a long /world/advance
          # would fail an HTTP liveness check; only check the port is open.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /world
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "isla.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
